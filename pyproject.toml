[project]
name = "attendance-tracker"
version = "0.1.0"
description = "Daily SAP portal attendance check with emailed report"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
]

[project.scripts]
attendance = "attendance.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attendance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
